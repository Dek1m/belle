; PgBouncer для belle. Секреты не здесь — userlist генерирует entrypoint из DB_USER/DB_PASSWORD.
; Runtime CRUD: belle/worker → :6432. CREATE/DROP DATABASE идёт в postgres:5432 в обход.

[databases]
; Системная БД — явно.
belle = host=postgres port=5432 dbname=belle
; Все прочие, включая belle_workspace_*. Не перечислять руками.
* = host=postgres port=5432

[pgbouncer]
listen_addr = *
listen_port = 6432
unix_socket_dir = /tmp
pidfile = /tmp/pgbouncer.pid

pool_mode = transaction
max_client_conn = 1000
default_pool_size = 5
min_pool_size = 0
reserve_pool_size = 2
server_idle_timeout = 60
server_lifetime = 3600
query_wait_timeout = 30

; Postgres на ai-t-01 — SCRAM. Нужен plaintext в userlist, иначе
; "wrong password type" при логине pgbouncer→postgres.
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt

; Клиенты на app-net без TLS. PgBouncer → postgres: SSL как у postgres (ssl=on на ai-t-01).
client_tls_sslmode = disable
server_tls_sslmode = require

ignore_startup_parameters = extra_float_digits,options

; Консоль SHOW POOLS — пользователь из userlist (CRUD-роль).
admin_users = belle
stats_users = belle
