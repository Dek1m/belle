# Belle service — свой compose-файл (консолидируется корневым ~/app/docker-compose.yml)
services:
  belle:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: belle
    restart: unless-stopped
    env_file: .env
    environment:
      SHALTIR_REDIS_HOST: redis
      SHALTIR_REDIS_PORT: "6379"
      SHALTIR_REDIS_BROKER_DB: "0"
      SHALTIR_REDIS_BACKEND_DB: "1"
      SHALTIR_CELERY_QUEUE: mia
      PYTHONPATH: /app/mia:/app
    ports:
      - "8000:8000"
    volumes:
      # Конфиги belle: config/ репозитория монтируется в /etc/belle (конфиг как код)
      - ./config:/etc/belle:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Общая сеть для всех сервисов ~/app (belle + postgres в одной сети)
networks:
  default:
    name: app-net