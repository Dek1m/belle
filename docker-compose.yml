# Belle + воркер. Консолидируется корневым ~/app/docker-compose.yml
services:
  belle:
    build: &belle_build
      context: .
      dockerfile: Dockerfile
    container_name: belle
    restart: unless-stopped
    env_file: .env
    environment: &belle_env
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      PYTHONPATH: /app/mia:/app
      BELLE_MODULES_DIR: /app/mia/modules
      DB_HOST: pgbouncer
      DB_PORT: "6432"
      DB_NAME: belle
      DB_ADMIN_HOST: postgres
      DB_ADMIN_PORT: "5432"
      # DB_SSL_MODE из .env: disable после pgbouncer; не хардкодить — пока ходим в postgres напрямую, оставить require/verify-full
      DB_SSL_MODE: ${DB_SSL_MODE:-disable}
      MIA_REST_BIND: "true"
      MIA_REST_HOST: "0.0.0.0"
      MIA_REST_PORT: "${MIA_REST_PORT:-8080}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      DB_POOL_MIN: "${DB_POOL_MIN:-1}"
      DB_POOL_MAX: "${DB_POOL_MAX:-2}"
      # Origin страницы albedo (не belle). Тест: http://ai-t-01.atom.ui:5173
      MIA_REST_SPA_ORIGINS: ${MIA_REST_SPA_ORIGINS:-http://ai-t-01.atom.ui:5173}
      # HTTP-тест: __Host- не встанет без TLS. Прод с HTTPS — true.
      MIA_REST_COOKIE_SECURE: ${MIA_REST_COOKIE_SECURE:-false}
      SERVICE_NAME: belle
      WORKSPACE_HOME_ROOT: /home
      TERM_HOME_ROOT: /home
    ports:
      - "8000:8000"
      - "8080:8080"
    volumes:
      - ./config:/etc/belle:ro
      - user-homes:/home
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging: &belle_log
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    build: *belle_build
    command: ["python", "migrate.py"]
    container_name: belle-migrate
    restart: "no"
    env_file: .env
    environment:
      <<: *belle_env
      MIA_DISPATCH: local
      SERVICE_NAME: belle-migrate
    volumes:
      - ./config:/etc/belle:ro
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    logging: *belle_log

  worker:
    build: *belle_build
    command: ["python", "-m", "modules.worker"]
    container_name: belle-worker
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      <<: *belle_env
      SERVICE_NAME: belle-worker
      # WORKER_CONCURRENCY не задаём — берётся число ядер
      FS_HOME_ROOT: /home
    volumes:
      - user-homes:/home
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -qa modules.worker /proc/1/cmdline || grep -qa celery /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
    logging: *belle_log

volumes:
  user-homes:

networks:
  default:
    name: app-net
