# Belle + воркер. Консолидируется корневым ~/app/docker-compose.yml
services:
  belle:
    build: &belle_build
      context: .
      dockerfile: Dockerfile
    container_name: belle
    restart: unless-stopped
    env_file: .env
    environment: &belle_env
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      PYTHONPATH: /app/mia:/app
    ports:
      - "8000:8000"
    volumes:
      - ./config:/etc/belle:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging: &belle_log
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build: *belle_build
    command: ["python", "-m", "modules.worker"]
    container_name: mia-worker
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      <<: *belle_env
      SERVICE_NAME: mia-worker
      # WORKER_CONCURRENCY не задаём — берётся число ядер
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -qa modules.worker /proc/1/cmdline || grep -qa celery /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
    logging: *belle_log

networks:
  default:
    name: app-net
