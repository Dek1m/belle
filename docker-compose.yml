# Belle + воркер. Консолидируется корневым ~/app/docker-compose.yml
services:
  belle:
    build: &belle_build
      context: .
      dockerfile: Dockerfile
    container_name: belle
    restart: unless-stopped
    env_file: .env
    environment: &belle_env
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      PYTHONPATH: /app/mia:/app
      BELLE_MODULES_DIR: /app/mia/modules
      DB_HOST: pgbouncer
      DB_PORT: "6432"
      DB_NAME: belle
      DB_ADMIN_HOST: postgres
      DB_ADMIN_PORT: "5432"
      # DB_SSL_MODE из .env: disable после pgbouncer; не хардкодить — пока ходим в postgres напрямую, оставить require/verify-full
      DB_SSL_MODE: ${DB_SSL_MODE:-disable}
    ports:
      - "8000:8000"
    volumes:
      - ./config:/etc/belle:ro
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging: &belle_log
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build: *belle_build
    command: ["python", "-m", "modules.worker"]
    container_name: belle-worker
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      <<: *belle_env
      # SERVICE_NAME из .env (belle) → логи/hostname belle-worker
      # WORKER_CONCURRENCY не задаём — берётся число ядер
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -qa modules.worker /proc/1/cmdline || grep -qa celery /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
    logging: *belle_log

networks:
  default:
    name: app-net
